<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Biba's Playground">
  <rect x="0" y="0" width="600" height="400" fill="#F2ECDE"/>

  <!-- big aperture circle (logo echo) -->
  <circle cx="195" cy="200" r="78" fill="#D42A1F" stroke="#141414" stroke-width="3.5"/>
  <circle cx="195" cy="200" r="32" fill="#F2ECDE" stroke="#141414" stroke-width="3.5"/>

  <!-- blue triangle -->
  <path d="M430 78 L492 176 L368 176 Z" fill="#1F4E8C" stroke="#141414" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- tilted yellow square -->
  <rect x="360" y="222" width="104" height="104" rx="12" fill="#F2B01E" stroke="#141414" stroke-width="3.5" transform="rotate(14 412 274)"/>

  <!-- small accent shapes -->
  <circle cx="300" cy="320" r="18" fill="#141414"/>
  <circle cx="110" cy="318" r="15" fill="#F2B01E" stroke="#141414" stroke-width="2.5"/>
</svg>
