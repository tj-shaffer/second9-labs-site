<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bangers N Mash — test case management">
  <defs>
    <filter id="bm-ink" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="600" height="400" fill="#F2ECDE"/>

  <!-- ============ KEY PLATE: the sheet stack ============
       Light tone surfaces stay registered with their outlines, or the
       illustration dissolves. Only the chromatic accents below slip. -->
  <g filter="url(#bm-ink)">
    <rect x="156" y="88" width="320" height="252" rx="14" fill="#E8DFC8" stroke="#141414" stroke-width="3.5"/>
    <rect x="148" y="80" width="320" height="252" rx="14" fill="#E8DFC8" stroke="#141414" stroke-width="3.5"/>
    <rect x="140" y="72" width="320" height="252" rx="14" fill="#F8F3E4" stroke="#141414" stroke-width="3.5"/>

    <!-- header bar + separator -->
    <rect x="170" y="102" width="150" height="16" rx="8" fill="#141414"/>
    <line x1="170" y1="142" x2="430" y2="142" stroke="#6B6A62" stroke-width="2"/>

    <!-- row pills -->
    <rect x="216" y="169" width="206" height="14" rx="7" fill="#E8DFC8" stroke="#141414" stroke-width="2"/>
    <rect x="216" y="215" width="174" height="14" rx="7" fill="#E8DFC8" stroke="#141414" stroke-width="2"/>
    <rect x="216" y="261" width="150" height="14" rx="7" fill="#E8DFC8" stroke="#141414" stroke-width="2"/>
  </g>

  <!-- ============ COLOR PLATE (pressed over the sheet, slipped down-right) ============ -->
  <g transform="translate(6, 6)">
    <circle cx="188" cy="176" r="14" fill="#1F4E8C"/>
    <circle cx="188" cy="222" r="14" fill="#1F4E8C"/>
    <rect x="174" y="254" width="28" height="28" rx="6" fill="#F2B01E"/>
    <circle cx="430" cy="110" r="13" fill="#D42A1F"/>
  </g>

  <!-- ============ INK PLATE: the marks, carved at true position ============ -->
  <g filter="url(#bm-ink)">
    <!-- aperture accent -->
    <circle cx="430" cy="110" r="13" fill="none" stroke="#141414" stroke-width="3"/>
    <circle cx="430" cy="110" r="5" fill="#F2ECDE" stroke="#141414" stroke-width="2"/>

    <!-- row 1: pass -->
    <circle cx="188" cy="176" r="14" fill="none" stroke="#141414" stroke-width="3"/>
    <path d="M181 176 L186 182 L196 169" fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- row 2: pass -->
    <circle cx="188" cy="222" r="14" fill="none" stroke="#141414" stroke-width="3"/>
    <path d="M181 222 L186 228 L196 215" fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- row 3: pending -->
    <rect x="174" y="254" width="28" height="28" rx="6" fill="none" stroke="#141414" stroke-width="3"/>

    <!-- gouge marks: where the blade skipped out of the block -->
    <g fill="#F2ECDE">
      <path d="M 250 300 q 16 -6 32 -4 l 0 3 q -16 -1 -32 4 z"/>
      <path d="M 396 306 l 13 -5 l 1 3 l -13 5 z"/>
    </g>
  </g>
</svg>
