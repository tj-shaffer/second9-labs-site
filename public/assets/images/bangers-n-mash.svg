<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bangers N Mash — test case management">
  <rect x="0" y="0" width="600" height="400" fill="#F2ECDE"/>

  <!-- stacked sheets behind, for depth (a stack of test cases) -->
  <rect x="156" y="88" width="320" height="252" rx="14" fill="#E8DFC8" stroke="#141414" stroke-width="3.5"/>
  <rect x="148" y="80" width="320" height="252" rx="14" fill="#E8DFC8" stroke="#141414" stroke-width="3.5"/>

  <!-- main sheet -->
  <rect x="140" y="72" width="320" height="252" rx="14" fill="#F8F3E4" stroke="#141414" stroke-width="3.5"/>

  <!-- header: title bar + logo-aperture accent -->
  <rect x="170" y="102" width="150" height="16" rx="8" fill="#141414"/>
  <circle cx="430" cy="110" r="13" fill="#D42A1F" stroke="#141414" stroke-width="2.5"/>
  <circle cx="430" cy="110" r="5" fill="#F2ECDE"/>
  <line x1="170" y1="142" x2="430" y2="142" stroke="#6B6A62" stroke-width="2"/>

  <!-- row 1: pass -->
  <circle cx="188" cy="176" r="14" fill="#1F4E8C" stroke="#141414" stroke-width="2.5"/>
  <path d="M181 176 L186 182 L196 169" fill="none" stroke="#F2ECDE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="169" width="206" height="14" rx="7" fill="#E8DFC8"/>

  <!-- row 2: pass -->
  <circle cx="188" cy="222" r="14" fill="#1F4E8C" stroke="#141414" stroke-width="2.5"/>
  <path d="M181 222 L186 228 L196 215" fill="none" stroke="#F2ECDE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="215" width="174" height="14" rx="7" fill="#E8DFC8"/>

  <!-- row 3: pending -->
  <rect x="174" y="254" width="28" height="28" rx="6" fill="#F2B01E" stroke="#141414" stroke-width="2.5"/>
  <rect x="216" y="261" width="150" height="14" rx="7" fill="#E8DFC8"/>
</svg>
