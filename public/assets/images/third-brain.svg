<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Third Brain OS">
  <defs>
    <!-- The carved ink plate: micro-imperfections along every cut edge -->
    <filter id="tb-ink" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="600" height="400" fill="#F2ECDE"/>

  <!-- ============ COLOR PLATE (pressed first, slipped down-right) ============ -->
  <g transform="translate(5, 5)">
    <circle cx="175" cy="135" r="22" fill="#1F4E8C"/>
    <circle cx="435" cy="150" r="19" fill="#F2B01E"/>
    <circle cx="165" cy="278" r="17" fill="#6B6A62"/>
    <circle cx="440" cy="275" r="23" fill="#1F4E8C"/>
    <circle cx="300" cy="76" r="15" fill="#F2B01E"/>
    <circle cx="300" cy="330" r="16" fill="#6B6A62"/>
    <circle cx="108" cy="205" r="10" fill="#1F4E8C"/>
    <circle cx="498" cy="205" r="11" fill="#F2B01E"/>
    <circle cx="300" cy="200" r="34" fill="#D42A1F"/>
  </g>

  <!-- ============ INK PLATE (carved, true position) ============ -->
  <g filter="url(#tb-ink)">
    <!-- edges (knowledge graph), drawn behind the nodes -->
    <g stroke="#141414" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="300" y1="200" x2="175" y2="135"/>
      <line x1="300" y1="200" x2="435" y2="150"/>
      <line x1="300" y1="200" x2="165" y2="278"/>
      <line x1="300" y1="200" x2="440" y2="275"/>
      <line x1="300" y1="200" x2="300" y2="76"/>
      <line x1="300" y1="200" x2="300" y2="330"/>
      <line x1="175" y1="135" x2="300" y2="76"/>
      <line x1="435" y1="150" x2="300" y2="76"/>
      <line x1="175" y1="135" x2="165" y2="278"/>
      <line x1="435" y1="150" x2="440" y2="275"/>
      <line x1="165" y1="278" x2="300" y2="330"/>
      <line x1="440" y1="275" x2="300" y2="330"/>
      <line x1="175" y1="135" x2="108" y2="205"/>
      <line x1="440" y1="275" x2="498" y2="205"/>
    </g>

    <!-- outer nodes: cut outlines over the color plate -->
    <g fill="none" stroke="#141414" stroke-width="3">
      <circle cx="175" cy="135" r="22"/>
      <circle cx="435" cy="150" r="19"/>
      <circle cx="440" cy="275" r="23"/>
      <circle cx="300" cy="76" r="15"/>
      <circle cx="108" cy="205" r="10" stroke-width="2.5"/>
      <circle cx="498" cy="205" r="11" stroke-width="2.5"/>
    </g>
    <!-- solid-ink nodes sit on their own grey ghost -->
    <circle cx="165" cy="278" r="17" fill="#141414"/>
    <circle cx="300" cy="330" r="16" fill="#141414"/>

    <!-- hub: the aperture, the core of the third brain -->
    <circle cx="300" cy="200" r="34" fill="none" stroke="#141414" stroke-width="4"/>
    <circle cx="300" cy="200" r="14" fill="#F2ECDE" stroke="#141414" stroke-width="3"/>

    <!-- gouge marks: where the blade skipped out of the block -->
    <g fill="#F2ECDE">
      <path d="M 286 178 q 12 -5 24 -3 l 0 3 q -12 -1 -24 3 z"/>
      <path d="M 428 141 l 11 -4 l 1 2 l -11 4 z"/>
      <path d="M 166 128 l 9 -4 l 1 2 l -9 4 z"/>
    </g>
  </g>
</svg>
