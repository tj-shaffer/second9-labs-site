<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Park PPA — digital parking payments">
  <defs>
    <filter id="pp-ink" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="600" height="400" fill="#F2ECDE"/>

  <!-- ============ COLOR PLATE: the blue sign block, slipped down-right ============ -->
  <rect x="110" y="86" width="232" height="232" rx="28" fill="#1F4E8C"/>

  <!-- ============ KEY PLATE: sign outline + card surface ============ -->
  <g filter="url(#pp-ink)">
    <!-- parking "P" sign: outline cut over the blue plate -->
    <rect x="104" y="80" width="232" height="232" rx="28" fill="none" stroke="#141414" stroke-width="4"/>
    <text x="220" y="266" font-family="Helvetica, Arial, sans-serif" font-size="210" font-weight="700" fill="#F2ECDE" text-anchor="middle">P</text>

    <!-- payment card overlapping the sign's lower-right -->
    <g transform="rotate(-8 405 312)">
      <rect x="300" y="252" width="212" height="120" rx="16" fill="#F8F3E4" stroke="#141414" stroke-width="3.5"/>
      <rect x="300" y="272" width="212" height="22" fill="#141414"/>
      <rect x="374" y="320" width="104" height="10" rx="5" fill="#6B6A62"/>
      <rect x="374" y="342" width="78" height="10" rx="5" fill="#6B6A62"/>
    </g>
  </g>

  <!-- ============ COLOR PLATE: the EMV chip, on the same slip ============ -->
  <g transform="rotate(-8 405 312)">
    <circle cx="344" cy="338" r="16" fill="#D42A1F"/>
  </g>

  <!-- ============ INK PLATE: chip detail + gouges ============ -->
  <g filter="url(#pp-ink)">
    <g transform="rotate(-8 405 312)">
      <!-- EMV chip = the aperture -->
      <circle cx="338" cy="332" r="16" fill="none" stroke="#141414" stroke-width="3"/>
      <circle cx="338" cy="332" r="6" fill="#F2ECDE" stroke="#141414" stroke-width="2"/>
    </g>

    <!-- gouge marks -->
    <g fill="#F2ECDE">
      <path d="M 130 286 q 18 -6 36 -4 l 0 4 q -18 -1 -36 4 z"/>
      <path d="M 300 104 l 14 -5 l 1 3 l -14 5 z"/>
      <path d="M 118 130 l 4 16 l -3 1 l -5 -16 z"/>
    </g>
  </g>
</svg>
